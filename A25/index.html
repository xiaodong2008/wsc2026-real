<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A25 · Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    button {
      font-size: 25px;
      font-weight: bold;
      padding: 25px 50px;
      color: #725ac1;
      background: transparent;
      border: 2px solid #725ac1;
      border-radius: 15px;
      cursor: pointer;
      transition: .3s;
    }
    button:hover {
      box-shadow: inset 0 -100px 0 0 #725ac1;
      color: #fff;
    }
    button:active {
      transform: scale(.9);
    }
  </style>
</head>
<body>
  <button>Button</button>
</body>
</html>
