<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A12 · 3D Image Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reconstructed starter. Scoring changes --n together with the number of cards. Do not hardcode 12 in CSS. -->
  <div class="a3d" style="--n: 12">
    <div class="card" style="--i: 0"><img src="images/1.jpg" alt="Card 1"></div>
    <div class="card" style="--i: 1"><img src="images/2.jpg" alt="Card 2"></div>
    <div class="card" style="--i: 2"><img src="images/3.jpg" alt="Card 3"></div>
    <div class="card" style="--i: 3"><img src="images/4.jpg" alt="Card 4"></div>
    <div class="card" style="--i: 4"><img src="images/5.jpg" alt="Card 5"></div>
    <div class="card" style="--i: 5"><img src="images/6.jpg" alt="Card 6"></div>
    <div class="card" style="--i: 6"><img src="images/7.jpg" alt="Card 7"></div>
    <div class="card" style="--i: 7"><img src="images/8.jpg" alt="Card 8"></div>
    <div class="card" style="--i: 8"><img src="images/9.jpg" alt="Card 9"></div>
    <div class="card" style="--i: 9"><img src="images/10.jpg" alt="Card 10"></div>
    <div class="card" style="--i: 10"><img src="images/11.jpg" alt="Card 11"></div>
    <div class="card" style="--i: 11"><img src="images/12.jpg" alt="Card 12"></div>
  </div>
</body>
</html>
