<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starter01 · Browser time</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    p { margin: 0 0 12px; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: #94a3b8; }
    h1 { margin: 0; font-size: 64px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>Browser time</p>
    <h1 id="t"></h1>
  </main>
  <script>
    const t = document.getElementById('t');
    const tick = () => { t.textContent = new Date().toLocaleTimeString(); };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
