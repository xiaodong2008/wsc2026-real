<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A07 · Morning Wire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="mast">
      <p class="kicker">The Morning Wire</p>
      <h1>City desk</h1>
    </header>
    <section class="grid">
      <article class="card">
        <img class="card__image" src="assets/loaded.jpg" alt="Harbour at dawn">
        <div class="card__body">
          <span class="card__chip">City desk</span>
          <h2 class="card__title">Harbour lights return after the storm</h2>
          <p class="card__text">Ferries are running again. The night crew stayed on the pier until the last lamp on the east wharf came back.</p>
        </div>
      </article>

      <article class="card" aria-hidden="true">
        <div class="sk sk--image"></div>
        <div class="card__body">
          <div class="sk sk--chip"></div>
          <div class="sk sk--line sk--line-lg"></div>
          <div class="sk sk--line sk--line-lg sk--w70"></div>
          <div class="sk sk--line"></div>
          <div class="sk sk--line"></div>
          <div class="sk sk--line sk--w40"></div>
        </div>
      </article>

      <article class="card" aria-hidden="true">
        <div class="sk sk--image"></div>
        <div class="card__body">
          <div class="sk sk--chip"></div>
          <div class="sk sk--line sk--line-lg"></div>
          <div class="sk sk--line sk--line-lg sk--w70"></div>
          <div class="sk sk--line"></div>
          <div class="sk sk--line"></div>
          <div class="sk sk--line sk--w40"></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
